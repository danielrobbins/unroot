name: Release

on:
  push:
    tags:
      - "[0-9]*"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      title: ${{ steps.release.outputs.title }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify release identity
        id: release
        run: |
          args=(metadata --github-output "${GITHUB_OUTPUT}")
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            args+=(--tag "${GITHUB_REF_NAME}")
          fi
          python3 scripts/release.py "${args[@]}"
      - name: Prepare release notes
        run: python3 scripts/release.py notes release-notes.md
      - name: Validate public documentation
        run: make docs-check
      - name: Upload release metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-metadata
          path: release-notes.md

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            runner: ubuntu-24.04
            cross_package: gcc-aarch64-linux-gnu
            cross_cc: aarch64-linux-gnu-gcc
            foreign_qemu_cpu: cortex-a53
          - architecture: arm64
            runner: ubuntu-24.04-arm
            cross_package: gcc-x86-64-linux-gnu
            cross_cc: x86_64-linux-gnu-gcc
            foreign_qemu_cpu: qemu64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify release identity
        run: |
          args=(metadata)
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            args+=(--tag "${GITHUB_REF_NAME}")
          fi
          python3 scripts/release.py "${args[@]}"
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential busybox-static libsubid-dev python3-pytest qemu-user-static \
            uidmap ${{ matrix.cross_package }}
      - name: Enable unprivileged user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo sed -i "/^${USER}:/d" /etc/subuid /etc/subgid
          printf '%s:1000000:65536\n' "$USER" | sudo tee -a /etc/subuid >/dev/null
          printf '%s:1000000:65536\n' "$USER" | sudo tee -a /etc/subgid >/dev/null
      - name: Build authoritative artifact
        run: >-
          python3 scripts/release.py build
          --architecture "${{ matrix.architecture }}"
      - name: Run unit tests
        run: |
          make test
          python3 -m pytest -q tests/test_packaging.py tests/test_release.py
      - name: Run native namespace qualification
        env:
          UNROOT_E2E_REPORT: e2e-native-${{ matrix.architecture }}.json
          UNROOT_E2E_STRICT: "1"
          UNROOT_E2E_REQUIRE: private_binfmt,rich_idmap,native_mode
        run: make e2e
      - name: Run cross-architecture qualification
        env:
          CROSS_CC: ${{ matrix.cross_cc }}
          FOREIGN_QEMU_CPU: ${{ matrix.foreign_qemu_cpu }}
          UNROOT_E2E_REPORT: e2e-cross-${{ matrix.architecture }}.json
          UNROOT_E2E_STRICT: "1"
          UNROOT_E2E_REQUIRE: cross_arch,native_mode
        run: make e2e-cross
      - name: Upload verified binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unroot-binary-${{ matrix.architecture }}
          path: dist/unroot-${{ needs.prepare.outputs.version }}-linux-${{ matrix.architecture }}

  package:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: ubuntu-24.04
            family: deb
            image: ubuntu:24.04
            runner: ubuntu-24.04
            architecture: x86_64
            qemu_package: qemu-user-static
          - target: ubuntu-24.04
            family: deb
            image: ubuntu:24.04
            runner: ubuntu-24.04-arm
            architecture: arm64
            qemu_package: qemu-user-static
          - target: ubuntu-26.04
            family: deb
            image: ubuntu:26.04
            runner: ubuntu-24.04
            architecture: x86_64
            qemu_package: qemu-user
          - target: ubuntu-26.04
            family: deb
            image: ubuntu:26.04
            runner: ubuntu-24.04-arm
            architecture: arm64
            qemu_package: qemu-user
          - target: debian-13
            family: deb
            image: debian:13
            runner: ubuntu-24.04
            architecture: x86_64
            qemu_package: qemu-user
          - target: debian-13
            family: deb
            image: debian:13
            runner: ubuntu-24.04-arm
            architecture: arm64
            qemu_package: qemu-user
          - target: fedora-44
            family: rpm
            image: fedora:44
            runner: ubuntu-24.04
            architecture: x86_64
            qemu_package: qemu-user-static
          - target: fedora-44
            family: rpm
            image: fedora:44
            runner: ubuntu-24.04-arm
            architecture: arm64
            qemu_package: qemu-user-static
          - target: el-9
            family: rpm
            image: rockylinux:9
            runner: ubuntu-24.04
            architecture: x86_64
            qemu_package: ""
          - target: el-9
            family: rpm
            image: rockylinux:9
            runner: ubuntu-24.04-arm
            architecture: arm64
            qemu_package: ""
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.image }}
    timeout-minutes: 30
    steps:
      - name: Bootstrap package container
        run: |
          if [[ "${{ matrix.family }}" == deb ]]; then
            apt-get update
            apt-get install -y --no-install-recommends ca-certificates git tar
          else
            dnf install -y ca-certificates git gzip tar
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Debian package toolchain
        if: matrix.family == 'deb'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential debhelper dpkg-dev libsubid-dev python3 \
            python3-pytest uidmap xz-utils
      - name: Install RPM package toolchain
        if: matrix.family == 'rpm'
        run: |
          if [[ "${{ matrix.target }}" == el-9 ]]; then
            dnf install -y dnf-plugins-core epel-release
            dnf config-manager --set-enabled crb
          fi
          dnf install -y \
            gcc-c++ glibc-static libstdc++-static make python3 \
            python3-pytest rpm-build shadow-utils-subid-devel xz
      - name: Build target-native package
        run: >-
          python3 scripts/package_release.py
          --target "${{ matrix.target }}"
          --architecture "${{ matrix.architecture }}"
      - name: Install and verify Debian package
        if: matrix.family == 'deb'
        run: |
          package="$(realpath "$(find dist/packages -maxdepth 1 -name '*.deb' -print -quit)")"
          test -n "${package}"
          test "$(dpkg-deb -f "${package}" Recommends)" = "${{ matrix.qemu_package }}"
          apt-get install -y "${package}"
          test "$(unroot --version)" = "${{ needs.prepare.outputs.version }}"
          ! readelf -lW /usr/bin/unroot | grep -q ' INTERP '
          readelf -lW /usr/bin/unroot-util | grep -q ' INTERP '
          ldd /usr/bin/unroot-util >/dev/null
      - name: Install and verify RPM package
        if: matrix.family == 'rpm'
        run: |
          package="$(realpath "$(find dist/packages -maxdepth 1 -name '*.rpm' -print -quit)")"
          test -n "${package}"
          if [[ -n "${{ matrix.qemu_package }}" ]]; then
            rpm -qp --recommends "${package}" | grep -Fxq '${{ matrix.qemu_package }}'
          fi
          dnf install -y "${package}"
          test "$(unroot --version)" = "${{ needs.prepare.outputs.version }}"
          ! readelf -lW /usr/bin/unroot | grep -q ' INTERP '
          readelf -lW /usr/bin/unroot-util | grep -q ' INTERP '
          ldd /usr/bin/unroot-util >/dev/null
      - name: Verify recommended static QEMU installation
        if: matrix.qemu_package != ''
        run: |
          if [[ "${{ matrix.architecture }}" == x86_64 ]]; then
            names=(qemu-aarch64-static qemu-aarch64)
          else
            names=(qemu-x86_64-static qemu-x86_64)
          fi
          emulator=""
          for name in "${names[@]}"; do
            if command -v "${name}" >/dev/null 2>&1; then
              emulator="$(command -v "${name}")"
              break
            fi
          done
          test -n "${emulator}"
          ! readelf -lW "${emulator}" | grep -q ' INTERP '
      - name: Upload verified package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unroot-package-${{ matrix.target }}-${{ matrix.architecture }}
          path: dist/packages/*
          if-no-files-found: error

  assemble:
    needs: [prepare, build, package]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download release notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-metadata
          path: release
      - name: Download verified binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: unroot-binary-*
          path: release
          merge-multiple: true
      - name: Download verified packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: unroot-package-*
          path: release
          merge-multiple: true
      - name: Build source archive
        run: |
          make dist
          cp "dist/unroot-${{ needs.prepare.outputs.version }}.tar.xz" release/
      - name: Generate SHA256SUMS
        run: >-
          python3 scripts/release.py checksums release
          --require-architecture x86_64
          --require-architecture arm64
      - name: Upload release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unroot-${{ needs.prepare.outputs.version }}
          path: release

  publish:
    needs: [prepare, assemble]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unroot-${{ needs.prepare.outputs.version }}
          path: release
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${{ needs.prepare.outputs.version }}"
          mapfile -t assets < <(
            find release -maxdepth 1 -type f \
              ! -name release-notes.md -print | sort
          )
          if gh release view "${version}" >/dev/null 2>&1; then
            gh release upload "${version}" "${assets[@]}" --clobber
          else
            args=(
              --draft
              --title "Unroot ${{ needs.prepare.outputs.title }}"
              --notes-file release/release-notes.md
            )
            if [[ "${{ needs.prepare.outputs.prerelease }}" == "true" ]]; then
              args+=(--prerelease)
            fi
            gh release create "${version}" "${assets[@]}" "${args[@]}"
          fi
